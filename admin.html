<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Smart Online Store</title>
    <style>
        body { font-family: sans-serif; background: #000000; color: #ffffff; margin: 0; padding: 20px; }
        .admin-box { max-width: 500px; background: #121212; border: 1px solid #333; margin: 40px auto; padding: 30px; border-radius: 12px; }
        h2 { text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; }
        input[type="text"], input[type="url"], select { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { width: 100%; background: #ffffff; color: #000000; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #cccccc; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>🛍️ Add New Product</h2>
        <form id="product-form">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="p-name" required placeholder="e.g. Cotton Kurti">
            </div>
            <div class="form-group">
                <label>Product Price</label>
                <input type="text" id="p-price" required placeholder="e.g. ₹499">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="p-category">
                    <option value="Fashion & Clothing">Fashion & Clothing</option>
                    <option value="Footwear">Footwear</option>
                    <option value="Beauty & Personal Care">Beauty & Personal Care</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Home & Kitchen">Home & Kitchen</option>
                    <option value="Bags & Accessories">Bags & Accessories</option>
                </select>
            </div>
            <div class="form-group">
                <label>Product Image URL</label>
                <input type="url" id="p-img" required placeholder="Paste direct image link">
            </div>
            <div class="form-group">
                <label>Affiliate / Product URL</label>
                <input type="url" id="p-link" required placeholder="Paste target website link">
            </div>
            <button type="submit" class="submit-btn">Publish Product</button>
        </form>
        <a href="home.html" class="back-link">← Back to Store</a>
    </div>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const supabase = createClient('https://dnlvoubafquotxcnqkhi.supabase.co', 'sb_publishable_fyiPBavDsU-Aax49r5Xi4g_9eg67WnA');

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const category = document.getElementById('p-category').value;
            const img = document.getElementById('p-img').value;
            const link = document.getElementById('p-link').value;

            const { error } = await supabase
                .from('products')
                .insert([{ name, price, category, img, link }]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Product successfully added to Supabase!');
                document.getElementById('product-form').reset();
            }
        });
    </script>
</body>
</html>
