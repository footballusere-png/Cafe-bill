<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Smart Online Store</title>
    <style>
        :root { --primary-color: #f43397; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .admin-box { max-width: 500px; background: white; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        input[type="text"], input[type="url"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #d22883; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>🛍️ Add New Product</h2>
        <form id="product-form">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="p-name" required placeholder="e.g. Cotton Kurti">
            </div>
            <div class="form-group">
                <label>Product Price</label>
                <input type="text" id="p-price" required placeholder="e.g. ₹499">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="p-category" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px;">
                    <option value="Fashion & Clothing">Fashion & Clothing</option>
                    <option value="Footwear">Footwear</option>
                    <option value="Beauty & Personal Care">Beauty & Personal Care</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Home & Kitchen">Home & Kitchen</option>
                    <option value="Bags & Accessories">Bags & Accessories</option>
                    <option value="Books & Stationery">Books & Stationery</option>
                    <option value="Toys & Kids">Toys & Kids</option>
                    <option value="Sports & Fitness">Sports & Fitness</option>
                    <option value="Automotive Accessories">Automotive Accessories</option>
                </select>
            </div>
            <div class="form-group">
                <label>Product Image URL</label>
                <input type="url" id="p-img" required placeholder="Paste image link here">
            </div>
            <div class="form-group">
                <label>Meesho Affiliate Link</label>
                <input type="url" id="p-link" required placeholder="Paste affiliate link here">
            </div>
            <button type="submit" class="submit-btn">Publish Product</button>
        </form>
        <a href="home.html" class="back-link">← Back to Store</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
            authDomain: "a-one-chat-e3642.firebaseapp.com",
            databaseURL: "https://a-one-chat-e3642-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "a-one-chat-e3642",
            storageBucket: "a-one-chat-e3642.firebasestorage.app",
            messagingSenderId: "91366490582",
            appId: "1:91366490582:web:669e8a9bfc54f424a82477"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const category = document.getElementById('p-category').value;
            const img = document.getElementById('p-img').value;
            const link = document.getElementById('p-link').value;

            try {
                const productRef = ref(db, 'products');
                await push(productRef, {
                    name: name,
                    price: price,
                    category: category,
                    img: img,
                    link: link
                });
                
                alert('Product added successfully!');
                document.getElementById('product-form').reset();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
