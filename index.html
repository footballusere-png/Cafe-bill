<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Online Store</title>
    <style>
        :root { --primary-color: #f43397; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #d22883; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; color: #666; cursor: pointer; }
        .toggle-link span { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="form-title">Smart Online Store</h2>
        <form id="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn" id="submit-btn">Login</button>
        </form>
        <div class="toggle-link" id="toggle-text">Don't have an account? <span id="toggle-action">Sign Up</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
            authDomain: "a-one-chat-e3642.firebaseapp.com",
            projectId: "a-one-chat-e3642",
            storageBucket: "a-one-chat-e3642.firebasestorage.app",
            messagingSenderId: "91366490582",
            appId: "1:91366490582:web:669e8a9bfc54f424a82477"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "home.html";
            }
        });

        let isSignUp = false;
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleAction = document.getElementById('toggle-action');
        const toggleText = document.getElementById('toggle-text');

        toggleText.addEventListener('click', () => {
            isSignUp = !isSignUp;
            formTitle.innerText = isSignUp ? "Create Account - Smart Online Store" : "Login - Smart Online Store";
            submitBtn.innerText = isSignUp ? "Sign Up" : "Login";
            toggleAction.innerText = isSignUp ? "Login" : "Sign Up";
        });

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                createUserWithEmailAndPassword(auth, email, password)
                    .then(() => {
                        window.location.href = "home.html";
                    })
                    .catch((error) => { alert(error.message); });
            } else {
                signInWithEmailAndPassword(auth, email, password)
                    .then(() => {
                        window.location.href = "home.html";
                    })
                    .catch((error) => { alert('Login failed. Please check your credentials.'); });
            }
        });
    </script>
</body>
</html>
