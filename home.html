<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Online Store</title>
    <style>
        :root { --primary-color: #f43397; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f8f9fa; color: #333; }
        
        header { background: #ffffff; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 18px; font-weight: bold; color: var(--primary-color); }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .admin-trigger-btn { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .logout-btn { background: #eee; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 600; }

        .banner { background: linear-gradient(135deg, #f43397, #9b51e0); color: white; text-align: center; padding: 30px 20px; }
        .banner h1 { margin: 0; font-size: 22px; }

        .filter-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }
        .search-bar { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn { background: #fff; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 500; font-size: 14px; }
        .cat-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .container { max-width: 1200px; margin: auto; padding: 0 15px 40px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-title { font-size: 15px; font-weight: 600; margin: 0 0 8px; color: #222; }
        .product-price { font-size: 16px; font-weight: bold; color: var(--primary-color); margin-bottom: 12px; }
        .buy-btn { display: block; width: 100%; padding: 10px; background: var(--primary-color); color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; box-sizing: border-box; }
        .buy-btn:hover { background: #d22883; }
        .powered { text-align: center; font-size: 12px; color: #777; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🛍️ Smart Online Store</div>
        <div class="header-right">
            <button class="admin-trigger-btn" id="admin-btn">Admin</button>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </div>
    </header>

    <div class="banner">
        <h1>Lowest Prices, Best Quality Shopping</h1>
    </div>

    <div class="filter-container">
        <input type="text" id="search-input" class="search-bar" placeholder="Search products...">
        <div class="categories" id="category-buttons">
            <button class="cat-btn active" data-category="all">All</button>
            <button class="cat-btn" data-category="Fashion & Clothing">Fashion & Clothing</button>
            <button class="cat-btn" data-category="Footwear">Footwear</button>
            <button class="cat-btn" data-category="Beauty & Personal Care">Beauty & Personal Care</button>
            <button class="cat-btn" data-category="Electronics">Electronics</button>
            <button class="cat-btn" data-category="Home & Kitchen">Home & Kitchen</button>
            <button class="cat-btn" data-category="Bags & Accessories">Bags & Accessories</button>
            <button class="cat-btn" data-category="Books & Stationery">Books & Stationery</button>
            <button class="cat-btn" data-category="Toys & Kids">Toys & Kids</button>
            <button class="cat-btn" data-category="Sports & Fitness">Sports & Fitness</button>
            <button class="cat-btn" data-category="Automotive Accessories">Automotive Accessories</button>
        </div>
    </div>

    <div class="container">
        <div class="product-grid" id="product-container">
            <!-- Products loaded from database -->
        </div>
        <div class="powered">Powered by Meesho</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
            authDomain: "a-one-chat-e3642.firebaseapp.com",
            projectId: "a-one-chat-e3642",
            storageBucket: "a-one-chat-e3642.firebasestorage.app",
            messagingSenderId: "91366490582",
            appId: "1:91366490582:web:669e8a9bfc54f424a82477",
            measurementId: "G-T4WVE2QKXB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "index.html"; }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "index.html"; });
        });

        document.getElementById('admin-btn').addEventListener('click', () => {
            let pwd = prompt("Enter Admin Password:");
            if (pwd === "risham0043") {
                window.location.href = "admin.html";
            } else if (pwd !== null) {
                alert("Incorrect Password!");
            }
        });

        let allProducts = [];

        async function loadProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                const container = document.getElementById('product-container');
                container.innerHTML = "";
                allProducts = [];

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    allProducts.push(p);
                });

                displayProducts(allProducts);
            } catch (error) {
                console.error("Error loading products: ", error);
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('product-container');
            container.innerHTML = "";

            if (products.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#777; grid-column: 1/-1;'>No products available.</p>";
                return;
            }

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card" data-category="${p.category || 'all'}" data-name="${p.name.toLowerCase()}">
                        <img src="${p.img}" alt="${p.name}">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price}</div>
                            <a href="${p.link}" class="buy-btn" target="_blank">View on Meesho</a>
                        </div>
                    </div>`;
            });
        }

        loadProducts();

        const searchInput = document.getElementById('search-input');
        const catButtons = document.querySelectorAll('.cat-btn');
        let currentCategory = 'all';

        searchInput.addEventListener('input', filterAndSearch);

        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                catButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-category');
                filterAndSearch();
            });
        });

        function filterAndSearch() {
            const query = searchInput.value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query);
                const matchesCat = (currentCategory === 'all' || (p.category && p.category === currentCategory));
                return matchesSearch && matchesCat;
            });
            displayProducts(filtered);
        }
    </script>
</body>
</html>
